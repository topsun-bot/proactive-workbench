name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Test, demo, package tar.gz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Unit tests
        run: go test ./...

      - name: Run umbrella demo (rain → calendar + alarm)
        run: |
          set -euo pipefail
          out="$(go run ./cmd/workbench demo \
            --weather=rain \
            --tz=Asia/Shanghai \
            --now=2026-10-09T13:00:00+08:00)"
          printf '%s\n' "$out"
          echo "$out" | grep -q "Reminders created"
          echo "$out" | grep -q "今天可能下雨"
          echo "$out" | grep -q "降水概率 80%"

      - name: Run umbrella demo (clear → still create reminders)
        run: |
          set -euo pipefail
          out="$(go run ./cmd/workbench demo \
            --weather=clear \
            --tz=Asia/Shanghai \
            --now=2026-10-09T13:00:00+08:00)"
          printf '%s\n' "$out"
          echo "$out" | grep -q "Reminders created"
          echo "$out" | grep -q "Outcome:  no_rain"
          echo "$out" | grep -q "今天降水概率 5%"
          echo "$out" | grep -q "带不带你定"
          echo "$out" | grep -q "MOCK weather (not live data)"

      - name: Run umbrella demo (unavailable weather → still remind)
        run: |
          set -euo pipefail
          out="$(go run ./cmd/workbench demo \
            --weather=unavailable \
            --tz=Asia/Shanghai \
            --now=2026-10-09T13:00:00+08:00)"
          printf '%s\n' "$out"
          echo "$out" | grep -q "Reminders created"
          echo "$out" | grep -q "天气暂时查不到"

      - name: Run today briefing
        run: |
          set -euo pipefail
          out="$(go run ./cmd/workbench today \
            --weather=clear \
            --tz=Asia/Shanghai \
            --now=2026-10-10T07:15:00+08:00)"
          printf '%s\n' "$out"
          echo "$out" | grep -q "slept little last night"
          echo "$out" | grep -q "10am meeting"
          echo "$out" | grep -q "MOCK"

      - name: Run proactivity tick (park, then dedupe)
        run: |
          set -euo pipefail
          go run ./cmd/proactivity tick \
            --weather=clear \
            --tz=Asia/Shanghai \
            --now=2026-10-10T15:00:00+08:00 \
            --repeat=2

      - name: Package Linux tar.gz
        run: ./scripts/package-linux.sh

      - name: Assert artifact
        run: |
          set -euo pipefail
          ART="dist/proactive-workbench-0.1.0-linux-amd64.tar.gz"
          test -f "$ART"
          ls -lh "$ART"
          SIZE="$(stat -c %s "$ART")"
          echo "artifact_bytes=$SIZE"
          if [ "$SIZE" -lt 10000 ]; then
            echo "error: artifact is unexpectedly small (${SIZE} bytes)" >&2
            exit 1
          fi
          tar -tzf "$ART"
          tmp="$(mktemp -d)"
          tar -xzf "$ART" -C "$tmp"
          "$tmp"/proactive-workbench-0.1.0-linux-amd64/workbench version
          "$tmp"/proactive-workbench-0.1.0-linux-amd64/workbench tools
          "$tmp"/proactive-workbench-0.1.0-linux-amd64/workbench today \
            --now=2026-10-10T07:15:00+08:00 --tz=Asia/Shanghai
          "$tmp"/proactive-workbench-0.1.0-linux-amd64/proactivity tick \
            --now=2026-10-10T15:00:00+08:00 --tz=Asia/Shanghai
          grep -qv '/' dist/proactive-workbench-0.1.0-linux-amd64.tar.gz.sha256
          (cd dist && sha256sum -c proactive-workbench-0.1.0-linux-amd64.tar.gz.sha256)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: proactive-workbench-0.1.0-linux-amd64.tar.gz
          path: |
            dist/proactive-workbench-0.1.0-linux-amd64.tar.gz
            dist/proactive-workbench-0.1.0-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Test, package unsigned DMG
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 1.22 test binaries abort on current macos-latest (dyld missing LC_UUID).
          go-version: "1.23.x"

      - name: Unit tests
        run: go test ./...

      - name: Package unsigned DMG
        run: ./scripts/package-macos.sh

      - name: Assert DMG
        run: |
          set -euo pipefail
          ART="dist/proactive-workbench-0.1.0-darwin-unsigned.dmg"
          test -f "$ART"
          ls -lh "$ART"
          SIZE="$(stat -f %z "$ART")"
          echo "artifact_bytes=$SIZE"
          if [ "$SIZE" -lt 10000 ]; then
            echo "error: DMG is unexpectedly small (${SIZE} bytes)" >&2
            exit 1
          fi
          test -x "dist/Today Workbench.app/Contents/MacOS/workbench"
          test -x "dist/Today Workbench.app/Contents/MacOS/TodayWorkbench"
          "dist/Today Workbench.app/Contents/MacOS/workbench" version
          "dist/Today Workbench.app/Contents/MacOS/workbench" today \
            --now=2026-10-10T07:15:00+08:00 --tz=Asia/Shanghai

      - name: Upload unsigned DMG
        uses: actions/upload-artifact@v4
        with:
          name: proactive-workbench-0.1.0-darwin-unsigned.dmg
          path: |
            dist/proactive-workbench-0.1.0-darwin-unsigned.dmg
            dist/proactive-workbench-0.1.0-darwin-unsigned.dmg.sha256
          if-no-files-found: error
          retention-days: 30
